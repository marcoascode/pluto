<!-- Pluto Mídia · rastreador de UTMs v1.2 (0.18) -->
<!-- Onde: WP Headers and Footers → "Scripts in Header", em TODOS os sites, logo após <head> e acima da tag do GTM. -->
<!-- Conta páginas e impressões renderizadas pelo Google Publisher Tag (GPT), por bloco de anúncios e tipo de dispositivo, -->
<!-- de TODAS as visitas (com e sem UTM) e envia ao Pluto. As visitas sem UTM são o que permite calcular a participação -->
<!-- de cada campanha na receita de cada bloco. Não usa cookies, não grava IP nem dados pessoais. -->
<script>
window.pluto_utm_tracker = 1;   /* 1ª linha fixa: identifica o código nas exclusões de plugins de otimização */
(function (w) {
  if (w.__plutoTrk) return; w.__plutoTrk = 1;
  var ENDPOINT = 'https://app.plutomidia.com.br/api/collect';
  var KEY = 'pluto_utm', TTL = 30 * 60 * 1000;   // a visita mantém as UTMs por até 30 min sem navegar
  var qs = new URLSearchParams(w.location.search), u = null, now = Date.now();
  var c = qs.get('utm_campaign') || '', ct = qs.get('utm_content') || '', s = qs.get('utm_source') || '';
  try {
    if (c || ct || s) { u = { c: c, ct: ct, s: s, t: now }; }
    else { var o = JSON.parse(w.sessionStorage.getItem(KEY) || 'null'); if (o && now - o.t < TTL) u = o; }
    if (u) { u.t = now; w.sessionStorage.setItem(KEY, JSON.stringify(u)); }
  } catch (e) { if (c || ct || s) u = { c: c, ct: ct, s: s, t: now }; }
  if (!u) u = { c: '', ct: '', s: '' };   // visita sem UTM (orgânica): também é contada

  var ua = w.navigator.userAgent || '';
  var dev = /iPad|Tablet|PlayBook|Silk|Kindle/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (/Macintosh/i.test(ua) && w.navigator.maxTouchPoints > 1) ? 'tablet'
    : /Mobi|iPhone|iPod|Android|IEMobile|Opera Mini/i.test(ua) ? 'smartphone' : 'desktop';
  var pv = 1, im = 0, units = {};
  function count(sl) {
    var p = ''; try { p = sl.getAdUnitPath(); } catch (e) {}
    im++; if (p) units[p] = (units[p] || 0) + 1;
  }
  function send() {
    if (!pv && !im) return;
    var body = JSON.stringify({ v: 2, h: w.location.hostname, c: u.c, ct: u.ct, s: u.s, pv: pv, im: im, d: dev, u: units });
    pv = 0; im = 0; units = {};
    try { if (w.navigator.sendBeacon && w.navigator.sendBeacon(ENDPOINT, body)) return; } catch (e) {}
    try { w.fetch(ENDPOINT, { method: 'POST', body: body, keepalive: true, mode: 'no-cors' }); } catch (e) {}
  }
  w.googletag = w.googletag || { cmd: [] };
  w.googletag.cmd.push(function () {
    var pa = w.googletag.pubads();
    // código carregado tarde (plugin de otimização que adia/combina scripts): conta os anúncios que já apareceram
    try { pa.getSlots().forEach(function (sl) { if (sl.getResponseInformation()) count(sl); }); } catch (e) {}
    pa.addEventListener('slotRenderEnded', function (e) { if (!e.isEmpty) count(e.slot); });
  });
  w.document.addEventListener('visibilitychange', function () { if (w.document.visibilityState === 'hidden') send(); });
  w.addEventListener('pagehide', send);
  w.setInterval(send, 15000);
})(window);
</script>
