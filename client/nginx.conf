# Nginx DENTRO do container web (porta 80 → host 127.0.0.1:8400).
# Serve o build do React (SPA) e, se alguém acessar direto pela 8400, também repassa /api para o container api.

# Mantém o https informado pelo Nginx do servidor; se vier direto, usa o esquema local.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 2m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Cabeçalhos de segurança (só aqui no server; nenhum location usa add_header, para não perder estes)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # API → container api (o "/" no fim do proxy_pass remove o prefixo /api)
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
  }

  # Arquivos com hash no nome: cache de 1 ano
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # index.html nunca em cache (para pegar o deploy novo na hora)
  location = /index.html {
    expires -1;
  }

  # SPA: qualquer rota do React Router cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
