# Nginx PRINCIPAL do servidor Hetzner (o que fica de cara para a internet).
# Copie para /etc/nginx/sites-available/pluto.conf, ative com
#   ln -s /etc/nginx/sites-available/pluto.conf /etc/nginx/sites-enabled/
# e rode: nginx -t && systemctl reload nginx
#
#   https://app.plutomidia.com.br/api/*  → API      127.0.0.1:4000  (o prefixo /api é removido)
#   https://app.plutomidia.com.br/*      → Frontend 127.0.0.1:8400
#
# Certificado: certbot --nginx -d app.plutomidia.com.br  (ou ajuste os caminhos ssl_* abaixo)

# Limite de requisições na API por IP (login tem um limite próprio no Node também)
limit_req_zone $binary_remote_addr zone=pluto_api:10m rate=20r/s;

upstream pluto_web { server 127.0.0.1:8400; keepalive 16; }
upstream pluto_api { server 127.0.0.1:4000; keepalive 16; }

# HTTP → HTTPS (e desafio do Let's Encrypt)
server {
  listen 80;
  listen [::]:80;
  server_name app.plutomidia.com.br;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  # Nginx 1.25.1+: troque "ssl http2" por "ssl" e adicione a linha "http2 on;"
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.plutomidia.com.br;

  ssl_certificate     /etc/letsencrypt/live/app.plutomidia.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.plutomidia.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:pluto_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  server_tokens off;
  client_max_body_size 2m;

  # ---------- Finance: envio do comprovante (PDF/JPG/PNG até 10 MB) — só esta rota aceita corpo maior ----------
  location = /api/finance/attachments/file {
    client_max_body_size 11m;
    limit_req zone=pluto_api burst=10 nodelay;
    proxy_pass http://pluto_api/finance/attachments/file;   # a query string (?entryId=…) segue junto
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # ---------- 0.18 · Campanhas Meta: envio dos criativos (até 20 imagens de 10 MB) ----------
  location ~ ^/api/meta/profiles/[0-9]+/creatives$ {
    client_max_body_size 210m;
    limit_req zone=pluto_api burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://pluto_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ---------- 0.18 · Publicação em cascata na Meta e geração de copies (IA): passam de 60 s ----------
  location ~ ^/api/meta/(copies/generate|profiles/[0-9]+/campaigns/publish)$ {
    limit_req zone=pluto_api burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://pluto_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ---------- API (Node) — a barra final no proxy_pass remove o /api ----------
  location /api/ {
    limit_req zone=pluto_api burst=40 nodelay;
    proxy_pass http://pluto_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ---------- Frontend (container Nginx com o build do React) ----------
  location / {
    proxy_pass http://pluto_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
